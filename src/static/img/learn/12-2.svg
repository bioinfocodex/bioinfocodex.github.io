<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>How the N50 statistic is calculated</title>
<rect width="720" height="250" fill="#ffffff"/>
<text x="360" y="24" font-size="12.5" fill="#0d1117" text-anchor="middle" font-weight="700">N50: sort contigs longest first, then walk until half the assembly is covered</text>
<rect x="60" y="60" width="157" height="40" rx="4" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="140" y="85" font-size="11" fill="#01664b" text-anchor="middle" font-weight="600">80 kb</text>
<rect x="220" y="60" width="137" height="40" rx="4" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<text x="290" y="85" font-size="11" fill="#9a4a06" text-anchor="middle" font-weight="600">70 kb</text>
<text x="290" y="122" font-size="12.5" fill="#9a4a06" text-anchor="middle" font-weight="700">N50 = 70 kb</text>
<text x="290" y="138" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">L50 = 2 contigs</text>
<rect x="360" y="60" width="97" height="40" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="410" y="85" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="600">50 kb</text>
<rect x="460" y="60" width="77" height="40" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="500" y="85" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="600">40 kb</text>
<rect x="540" y="60" width="57" height="40" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="570" y="85" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="600">30 kb</text>
<rect x="600" y="60" width="37" height="40" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="620" y="85" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="600">20</text>
<rect x="640" y="60" width="17" height="40" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="650" y="85" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="600">10</text>
<line x1="360" y1="44" x2="360" y2="108" stroke="#e5484d" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="360" y="40" font-size="10.5" fill="#a4262c" text-anchor="middle" font-weight="400">50% of 300 kb = 150 kb</text>
<text x="360" y="176" font-size="11.5" fill="#0d1117" text-anchor="middle" font-weight="400">Half of all assembled bases sit in contigs of at least the N50 length</text>
<text x="360" y="200" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">A larger N50 means a more contiguous assembly, but it says nothing about correctness:</text>
<text x="360" y="218" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">wrongly joined contigs raise N50, which is why BUSCO completeness is reported with it</text>
</svg>
