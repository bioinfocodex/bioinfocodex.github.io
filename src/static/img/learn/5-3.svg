<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Spliced and unspliced RNA-seq reads aligned to a reference genome</title>
<rect width="720" height="240" fill="#ffffff"/>
<text x="20" y="24" font-size="12" fill="#0d1117" text-anchor="start" font-weight="700">Reference genome</text>
<line x1="20" y1="56" x2="700" y2="56" stroke="#8b95a3" stroke-width="2" stroke-linecap="round"/>
<rect x="80" y="42" width="190" height="28" rx="4" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<rect x="450" y="42" width="190" height="28" rx="4" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="175" y="61" font-size="11.5" fill="#01664b" text-anchor="middle" font-weight="600">exon 1</text>
<text x="545" y="61" font-size="11.5" fill="#01664b" text-anchor="middle" font-weight="600">exon 2</text>
<text x="360" y="48" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">intron (not in mRNA)</text>
<rect x="96" y="96" width="100" height="9" rx="3" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<rect x="150" y="112" width="100" height="9" rx="3" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<rect x="470" y="96" width="100" height="9" rx="3" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<rect x="520" y="112" width="100" height="9" rx="3" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<rect x="500" y="128" width="100" height="9" rx="3" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<rect x="210" y="150" width="60" height="9" rx="3" fill="#e0762a" stroke="#e0762a" stroke-width="0"/>
<rect x="450" y="150" width="50" height="9" rx="3" fill="#e0762a" stroke="#e0762a" stroke-width="0"/>
<line x1="270" y1="154.5" x2="450" y2="154.5" stroke="#e0762a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<rect x="240" y="168" width="30" height="9" rx="3" fill="#e0762a" stroke="#e0762a" stroke-width="0"/>
<rect x="450" y="168" width="80" height="9" rx="3" fill="#e0762a" stroke="#e0762a" stroke-width="0"/>
<line x1="270" y1="172.5" x2="450" y2="172.5" stroke="#e0762a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<rect x="194" y="186" width="76" height="9" rx="3" fill="#e0762a" stroke="#e0762a" stroke-width="0"/>
<rect x="450" y="186" width="34" height="9" rx="3" fill="#e0762a" stroke="#e0762a" stroke-width="0"/>
<line x1="270" y1="190.5" x2="450" y2="190.5" stroke="#e0762a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="700" y="90" font-size="11" fill="#0a4fa3" text-anchor="end" font-weight="400">unspliced reads</text>
<text x="360" y="144" font-size="11" fill="#9a4a06" text-anchor="middle" font-weight="400">spliced reads jump the intron</text>
<text x="360" y="222" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">A splice-aware aligner (HISAT2, STAR) is needed because one read can come from two exons</text>
</svg>
