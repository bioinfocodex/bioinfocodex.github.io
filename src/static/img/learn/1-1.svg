<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>The bioinformatics workflow from question to insight</title>
<rect width="720" height="250" fill="#ffffff"/>
<text x="360" y="24" font-size="14" fill="#0d1117" text-anchor="middle" font-weight="700">From a biological question to an answer</text>
<rect x="16" y="48" width="120" height="62" rx="8" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="76" y="74" font-size="12.5" fill="#5b21b6" text-anchor="middle" font-weight="600">Question</text>
<text x="76" y="90.5" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">hypothesis</text>
<rect x="158" y="48" width="120" height="62" rx="8" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5"/>
<text x="218" y="74" font-size="12.5" fill="#0a4fa3" text-anchor="middle" font-weight="600">Experiment</text>
<text x="218" y="90.5" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">sequencing, MS</text>
<line x1="139" y1="79" x2="147" y2="79" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="155.0,79.0 147.0,74.5 147.0,83.5" fill="#8b95a3"/>
<rect x="300" y="48" width="120" height="62" rx="8" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<text x="360" y="74" font-size="12.5" fill="#9a4a06" text-anchor="middle" font-weight="600">Raw data</text>
<text x="360" y="90.5" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">FASTQ, spectra</text>
<line x1="281" y1="79" x2="289" y2="79" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="297.0,79.0 289.0,74.5 289.0,83.5" fill="#8b95a3"/>
<rect x="442" y="48" width="120" height="62" rx="8" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="502" y="74" font-size="12.5" fill="#01664b" text-anchor="middle" font-weight="600">Analysis</text>
<text x="502" y="90.5" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">QC, align, stats</text>
<line x1="423" y1="79" x2="431" y2="79" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="439.0,79.0 431.0,74.5 431.0,83.5" fill="#8b95a3"/>
<rect x="584" y="48" width="120" height="62" rx="8" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="644" y="74" font-size="12.5" fill="#5b21b6" text-anchor="middle" font-weight="600">Insight</text>
<text x="644" y="90.5" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">genes, pathways</text>
<line x1="565" y1="79" x2="573" y2="79" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="581.0,79.0 573.0,74.5 573.0,83.5" fill="#8b95a3"/>
<text x="360" y="150" font-size="12" fill="#5b6472" text-anchor="middle" font-weight="400">Bioinformatics sits where three fields meet</text>
<rect x="120" y="166" width="150" height="44" rx="8" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="195" y="191.5" font-size="13" fill="#01664b" text-anchor="middle" font-weight="600">Biology</text>
<rect x="285" y="166" width="150" height="44" rx="8" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5"/>
<text x="360" y="191.5" font-size="13" fill="#0a4fa3" text-anchor="middle" font-weight="600">Computer science</text>
<rect x="450" y="166" width="150" height="44" rx="8" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<text x="525" y="191.5" font-size="13" fill="#9a4a06" text-anchor="middle" font-weight="600">Statistics</text>
<text x="360" y="236" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="400">what to ask  ·  how to compute it  ·  whether to believe it</text>
</svg>
