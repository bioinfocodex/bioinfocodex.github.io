<polygon points="547.0,177.0 539.0,172.5 539.0,181.5" fill="#8b95a3"/>
<path d="M650 96 C650 126 80 116 80 148" fill="none" stroke="#8b95a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<text x="360" y="230" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Calling each sample to a GVCF first lets new samples be added without redoing the alignment</text>
