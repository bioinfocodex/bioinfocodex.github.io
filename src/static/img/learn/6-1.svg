<rect x="550" y="150" width="154" height="54" rx="8" fill="#feecec" stroke="#e5484d" stroke-width="1.5"/>
<text x="627" y="180" font-size="12" fill="#a4262c" text-anchor="middle" font-weight="600">Annotated VCF</text>
