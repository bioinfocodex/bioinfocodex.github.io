<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Over-representation analysis as a two by two table</title>
<rect width="720" height="250" fill="#ffffff"/>
<rect x="30" y="30" width="330" height="190" rx="8" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="195" y="50" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">All genes tested (background): 15,000</text>
<circle cx="155" cy="135" r="62" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5" opacity="0.85"/>
<circle cx="235" cy="135" r="62" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5" opacity="0.7"/>
<text x="124" y="132" font-size="11.5" fill="#0a4fa3" text-anchor="middle" font-weight="600">DE genes</text>
<text x="124" y="148" font-size="11.5" fill="#0a4fa3" text-anchor="middle" font-weight="400">500</text>
<text x="274" y="132" font-size="11.5" fill="#9a4a06" text-anchor="middle" font-weight="600">Pathway</text>
<text x="274" y="148" font-size="11.5" fill="#9a4a06" text-anchor="middle" font-weight="400">200</text>
<text x="195" y="132" font-size="10.5" fill="#0d1117" text-anchor="middle" font-weight="600">overlap</text>
<text x="195" y="148" font-size="12" fill="#0d1117" text-anchor="middle" font-weight="700">30</text>
<text x="540" y="46" font-size="12.5" fill="#0d1117" text-anchor="middle" font-weight="700">Is 30 more than chance?</text>
<rect x="400" y="64" width="96" height="30" rx="3" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="448" y="83" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400"></text>
<rect x="500" y="64" width="96" height="30" rx="3" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="548" y="83" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">In pathway</text>
<rect x="600" y="64" width="96" height="30" rx="3" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="648" y="83" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Not in pathway</text>
<rect x="400" y="98" width="96" height="30" rx="3" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="448" y="117" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">DE</text>
<rect x="500" y="98" width="96" height="30" rx="3" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="548" y="117" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="600">30</text>
<rect x="600" y="98" width="96" height="30" rx="3" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="648" y="117" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="600">470</text>
<rect x="400" y="132" width="96" height="30" rx="3" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="448" y="151" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Not DE</text>
<rect x="500" y="132" width="96" height="30" rx="3" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="548" y="151" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="600">170</text>
<rect x="600" y="132" width="96" height="30" rx="3" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="648" y="151" font-size="11" fill="#0d1117" text-anchor="middle" font-weight="600">14,330</text>
<text x="548" y="190" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Expected by chance: 500 × 200 / 15,000 ≈ 6.7</text>
<text x="548" y="208" font-size="11" fill="#01664b" text-anchor="middle" font-weight="600">Observed 30, so about 4.5 times enriched</text>
<text x="548" y="226" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">Fisher's exact or hypergeometric test gives the p-value</text>
</svg>
