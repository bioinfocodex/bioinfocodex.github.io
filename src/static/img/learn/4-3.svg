<line x1="230" y1="94" x2="230" y2="184" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
<line x1="140" y1="139" x2="140" y2="220" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
<text x="414" y="52" font-size="10.5" fill="#0a4fa3" text-anchor="end" font-weight="600">100</text>
<text x="394" y="124" font-size="10.5" fill="#0a4fa3" text-anchor="end" font-weight="600">98</text>
<text x="324" y="88" font-size="10.5" fill="#0a4fa3" text-anchor="end" font-weight="600">95</text>
<text x="224" y="133" font-size="10.5" fill="#0a4fa3" text-anchor="end" font-weight="600">72</text>
<text x="84" y="184" font-size="10.5" fill="#5b6472" text-anchor="end" font-weight="400">root</text>
<line x1="160" y1="244" x2="250" y2="244" stroke="#0d1117" stroke-width="1.6" stroke-linecap="round"/>
<text x="205" y="258" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="400">0.1 substitutions per site</text>
<text x="30" y="30" font-size="11" fill="#0a4fa3" text-anchor="start" font-weight="400">Blue numbers: bootstrap support (%)</text>
<text x="30" y="48" font-size="11" fill="#5b6472" text-anchor="start" font-weight="400">Horizontal length: amount of change</text>
<text x="30" y="66" font-size="11" fill="#5b6472" text-anchor="start" font-weight="400">Vertical lines carry no meaning</text>
