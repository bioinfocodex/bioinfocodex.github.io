<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>How to read a rooted phylogenetic tree with bootstrap values</title>
<rect width="720" height="260" fill="#ffffff"/>
<text x="520" y="44" font-size="12" fill="#0d1117" text-anchor="start" font-weight="400">Human</text>
<text x="520" y="80" font-size="12" fill="#0d1117" text-anchor="start" font-weight="400">Chimpanzee</text>
