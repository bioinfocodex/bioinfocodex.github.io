<text x="520" y="152" font-size="12" fill="#0d1117" text-anchor="start" font-weight="400">Rat</text>
<text x="520" y="188" font-size="12" fill="#0d1117" text-anchor="start" font-weight="400">Chicken</text>
<text x="520" y="224" font-size="12" fill="#0d1117" text-anchor="start" font-weight="400">Zebrafish (outgroup)</text>
<line x1="420" y1="40" x2="510" y2="40" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
