<line x1="330" y1="130" x2="400" y2="130" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
<line x1="230" y1="94" x2="330" y2="94" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
<line x1="230" y1="184" x2="510" y2="184" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
<line x1="140" y1="139" x2="230" y2="139" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
<line x1="140" y1="220" x2="510" y2="220" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
<line x1="90" y1="180" x2="140" y2="180" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round"/>
