<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Evidence tracks combined into a final gene model</title>
<rect width="720" height="260" fill="#ffffff"/>
<text x="150" y="34" font-size="11.5" fill="#0d1117" text-anchor="end" font-weight="600">RNA-seq coverage</text>
<path d="M210 50 L218 22 L282 22 L290 50 Z" fill="#e7f1fd" stroke="#0969da" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M380 50 L388 22 L462 22 L470 50 Z" fill="#e7f1fd" stroke="#0969da" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M560 50 L568 22 L632 22 L640 50 Z" fill="#e7f1fd" stroke="#0969da" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="170" y1="50" x2="690" y2="50" stroke="#8b95a3" stroke-width="1" stroke-linecap="round"/>
<text x="150" y="84" font-size="11.5" fill="#0d1117" text-anchor="end" font-weight="600">Protein homology</text>
<rect x="226" y="72" width="64" height="14" rx="3" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="380" y="72" width="90" height="14" rx="3" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="560" y="72" width="62" height="14" rx="3" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="290" y1="79" x2="380" y2="79" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="470" y1="79" x2="560" y2="79" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="150" y="124" font-size="11.5" fill="#0d1117" text-anchor="end" font-weight="600">Ab initio prediction</text>
<rect x="218" y="112" width="72" height="14" rx="3" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<rect x="380" y="112" width="90" height="14" rx="3" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<rect x="500" y="112" width="20" height="14" rx="3" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<rect x="560" y="112" width="72" height="14" rx="3" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<text x="510" y="106" font-size="9.5" fill="#a4262c" text-anchor="middle" font-weight="400">false exon</text>
<line x1="170" y1="150" x2="690" y2="150" stroke="#8b95a3" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="150" y="186" font-size="11.5" fill="#0d1117" text-anchor="end" font-weight="700">Final gene model</text>
<line x1="210" y1="181" x2="640" y2="181" stroke="#00a87e" stroke-width="1.6" stroke-linecap="round"/>
<rect x="210" y="172" width="80" height="18" rx="3" fill="#00a87e" stroke="#00a87e" stroke-width="0"/>
<rect x="380" y="172" width="90" height="18" rx="3" fill="#00a87e" stroke="#00a87e" stroke-width="0"/>
<rect x="560" y="172" width="80" height="18" rx="3" fill="#00a87e" stroke="#00a87e" stroke-width="0"/>
<line x1="644" y1="181" x2="662" y2="181" stroke="#00a87e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="670.0,181.0 662.0,176.5 662.0,185.5" fill="#00a87e"/>
<text x="250" y="208" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">exon 1</text>
<text x="425" y="208" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">exon 2</text>
<text x="600" y="208" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">exon 3</text>
<text x="360" y="240" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Annotation pipelines weigh several lines of evidence; agreement between them gives the model</text>
