<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>The central dogma: DNA to RNA to protein</title>
<rect width="720" height="250" fill="#ffffff"/>
<rect x="40" y="70" width="150" height="70" rx="8" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5"/>
<text x="115" y="100" font-size="16" fill="#0a4fa3" text-anchor="middle" font-weight="600">DNA</text>
<text x="115" y="120" font-size="14" fill="#5b6472" text-anchor="middle" font-weight="400">stores information</text>
<rect x="285" y="70" width="150" height="70" rx="8" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="360" y="100" font-size="16" fill="#01664b" text-anchor="middle" font-weight="600">RNA</text>
<text x="360" y="120" font-size="14" fill="#5b6472" text-anchor="middle" font-weight="400">carries the message</text>
<rect x="530" y="70" width="150" height="70" rx="8" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="605" y="100" font-size="16" fill="#5b21b6" text-anchor="middle" font-weight="600">Protein</text>
<text x="605" y="120" font-size="14" fill="#5b6472" text-anchor="middle" font-weight="400">does the work</text>
<line x1="194" y1="105" x2="273" y2="105" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="281.0,105.0 273.0,100.5 273.0,109.5" fill="#8b95a3"/>
<text x="237.5" y="99" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">transcription</text>
<line x1="439" y1="105" x2="518" y2="105" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="526.0,105.0 518.0,100.5 518.0,109.5" fill="#8b95a3"/>
<text x="482.5" y="99" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">translation</text>
<path d="M85 68 C70 20 160 20 145 62" fill="none" stroke="#0969da" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="146" y1="58" x2="145.796" y2="60.0397" stroke="#0969da" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="145.0,68.0 150.3,60.5 141.3,59.6" fill="#0969da"/>
<text x="115" y="22" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">replication</text>
<line x1="360" y1="160" x2="123" y2="160" stroke="#e0762a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="115.0,160.0 123.0,164.5 123.0,155.5" fill="#e0762a"/>
<text x="238" y="176" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">reverse transcription (retroviruses, cDNA synthesis in the lab)</text>
<text x="115" y="208" font-size="12" fill="#0a4fa3" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">5'-ATG GCC TGG-3'</text>
<text x="360" y="208" font-size="12" fill="#01664b" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">5'-AUG GCC UGG-3'</text>
<text x="605" y="208" font-size="12" fill="#5b21b6" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Met - Ala - Trp</text>
<text x="360" y="234" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">T becomes U in RNA; each codon of three bases gives one amino acid</text>
</svg>
