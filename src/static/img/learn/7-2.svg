<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Why raw counts must be normalised for sequencing depth</title>
<rect width="720" height="250" fill="#ffffff"/>
<text x="170" y="24" font-size="12.5" fill="#0d1117" text-anchor="middle" font-weight="700">Raw counts for one gene</text>
<line x1="40" y1="190" x2="310" y2="190" stroke="#0d1117" stroke-width="1.4" stroke-linecap="round"/>
<rect x="80" y="125" width="70" height="65" rx="3" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5"/>
<text x="115" y="119" font-size="11.5" fill="#0a4fa3" text-anchor="middle" font-weight="600">100</text>
<text x="115" y="206" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Sample A</text>
<rect x="190" y="60" width="70" height="130" rx="3" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<text x="225" y="54" font-size="11.5" fill="#9a4a06" text-anchor="middle" font-weight="600">200</text>
<text x="225" y="206" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Sample B</text>
<text x="530" y="24" font-size="12.5" fill="#0d1117" text-anchor="middle" font-weight="700">After normalisation</text>
<line x1="400" y1="190" x2="670" y2="190" stroke="#0d1117" stroke-width="1.4" stroke-linecap="round"/>
<rect x="440" y="125" width="70" height="65" rx="3" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5"/>
<text x="475" y="119" font-size="11.5" fill="#0a4fa3" text-anchor="middle" font-weight="600">100</text>
<text x="475" y="206" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Sample A</text>
<rect x="550" y="125" width="70" height="65" rx="3" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<text x="585" y="119" font-size="11.5" fill="#9a4a06" text-anchor="middle" font-weight="600">100</text>
<text x="585" y="206" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Sample B</text>
<text x="115" y="222" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">10 M reads</text>
<text x="225" y="222" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">20 M reads</text>
<line x1="330" y1="120" x2="376" y2="120" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="384.0,120.0 376.0,115.5 376.0,124.5" fill="#8b95a3"/>
<text x="357" y="110" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="400">divide by</text>
<text x="357" y="138" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="400">size factor</text>
<text x="530" y="222" font-size="10.5" fill="#5b6472" text-anchor="middle" font-weight="400">no real difference</text>
<text x="360" y="244" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Sample B was simply sequenced twice as deeply</text>
</svg>
