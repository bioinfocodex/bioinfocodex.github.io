<text x="425" y="228" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">The earlier samples are combined, the less handling variation is added between them</text>
<text x="425" y="246" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Label-free scales to any number of samples; TMT multiplexes up to 18 in one run</text>
