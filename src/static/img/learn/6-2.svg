<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Anatomy of one VCF record</title>
<rect width="720" height="240" fill="#ffffff"/>
<rect x="16" y="50" width="50" height="26" rx="4" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5"/>
<text x="41" y="67" font-size="10.5" fill="#0a4fa3" text-anchor="middle" font-weight="700">CHROM</text>
<rect x="16" y="80" width="50" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="41" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">chr7</text>
<rect x="70" y="50" width="78" height="26" rx="4" fill="#e7f1fd" stroke="#0969da" stroke-width="1.5"/>
<text x="109" y="67" font-size="10.5" fill="#0a4fa3" text-anchor="middle" font-weight="700">POS</text>
<rect x="70" y="80" width="78" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="109" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">140753336</text>
<rect x="152" y="50" width="86" height="26" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="195" y="67" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="700">ID</text>
<rect x="152" y="80" width="86" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="195" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">rs113488022</text>
<rect x="242" y="50" width="36" height="26" rx="4" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="260" y="67" font-size="10.5" fill="#01664b" text-anchor="middle" font-weight="700">REF</text>
<rect x="242" y="80" width="36" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="260" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">A</text>
<rect x="282" y="50" width="36" height="26" rx="4" fill="#feecec" stroke="#e5484d" stroke-width="1.5"/>
<text x="300" y="67" font-size="10.5" fill="#a4262c" text-anchor="middle" font-weight="700">ALT</text>
<rect x="282" y="80" width="36" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="300" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">T</text>
<rect x="322" y="50" width="50" height="26" rx="4" fill="#fef3ea" stroke="#e0762a" stroke-width="1.5"/>
<text x="347" y="67" font-size="10.5" fill="#9a4a06" text-anchor="middle" font-weight="700">QUAL</text>
<rect x="322" y="80" width="50" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="347" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">812.6</text>
<rect x="376" y="50" width="54" height="26" rx="4" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<text x="403" y="67" font-size="10.5" fill="#01664b" text-anchor="middle" font-weight="700">FILTER</text>
<rect x="376" y="80" width="54" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="403" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PASS</text>
<rect x="434" y="50" width="100" height="26" rx="4" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="484" y="67" font-size="10.5" fill="#5b21b6" text-anchor="middle" font-weight="700">INFO</text>
<rect x="434" y="80" width="100" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="484" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DP=64;AF=0.5</text>
<rect x="538" y="50" width="74" height="26" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="575" y="67" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="700">FORMAT</text>
<rect x="538" y="80" width="74" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="575" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GT:AD:DP</text>
<rect x="616" y="50" width="100" height="26" rx="4" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="666" y="67" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="700">SAMPLE</text>
<rect x="616" y="80" width="100" height="26" rx="4" fill="#ffffff" stroke="#b6bfca" stroke-width="1.5"/>
<text x="666" y="97" font-size="9.6" fill="#0d1117" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0/1:31,33:64</text>
<text x="360" y="28" font-size="13" fill="#0d1117" text-anchor="middle" font-weight="700">One line of a VCF file is one variant site</text>
<text x="30" y="140" font-size="13" fill="#5b21b6" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0/1</text>
<text x="70" y="140" font-size="11.5" fill="#0d1117" text-anchor="start" font-weight="400">heterozygous: one reference allele, one alternate</text>
<text x="30" y="164" font-size="13" fill="#5b21b6" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AD 31,33</text>
<text x="110" y="164" font-size="11.5" fill="#0d1117" text-anchor="start" font-weight="400">31 reads support A and 33 support T</text>
<text x="30" y="188" font-size="13" fill="#5b21b6" text-anchor="start" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DP 64</text>
<text x="110" y="188" font-size="11.5" fill="#0d1117" text-anchor="start" font-weight="400">total read depth at this position</text>
<text x="360" y="224" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">Genotypes: 0/0 homozygous reference, 0/1 heterozygous, 1/1 homozygous alternate</text>
</svg>
