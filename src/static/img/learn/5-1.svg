<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>A confounded design compared with a balanced, blocked design</title>
<rect width="720" height="250" fill="#ffffff"/>
<text x="180" y="26" font-size="12.5" fill="#a4262c" text-anchor="middle" font-weight="700">Confounded: do not do this</text>
<rect x="20" y="40" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="95" y="60" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="400">Day 1</text>
<circle cx="50" cy="96" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="95" cy="96" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="140" cy="96" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="50" cy="138" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="95" cy="138" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="140" cy="138" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<rect x="185" y="40" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="260" y="60" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="400">Day 2</text>
<circle cx="215" cy="96" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="260" cy="96" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="305" cy="96" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="215" cy="138" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="260" cy="138" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="305" cy="138" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<text x="180" y="192" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">batch and treatment cannot be separated</text>
<text x="540" y="26" font-size="12.5" fill="#01664b" text-anchor="middle" font-weight="700">Balanced: do this</text>
<rect x="380" y="40" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="455" y="60" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="400">Day 1</text>
<circle cx="410" cy="96" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="455" cy="96" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="500" cy="96" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="410" cy="138" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="455" cy="138" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="500" cy="138" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<rect x="545" y="40" width="150" height="130" rx="8" fill="#f6f8fa" stroke="#b6bfca" stroke-width="1.5"/>
<text x="620" y="60" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="400">Day 2</text>
<circle cx="575" cy="96" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="620" cy="96" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="665" cy="96" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="575" cy="138" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<circle cx="620" cy="138" r="13" fill="#e0762a" stroke="#e0762a" stroke-width="1.5"/>
<circle cx="665" cy="138" r="13" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<text x="540" y="192" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">each batch holds every condition</text>
<circle cx="270" cy="226" r="8" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
<text x="284" y="230" font-size="11.5" fill="#0d1117" text-anchor="start" font-weight="400">control</text>
