<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>How featureCounts assigns reads to genes</title>
<rect width="720" height="250" fill="#ffffff"/>
<line x1="20" y1="60" x2="700" y2="60" stroke="#8b95a3" stroke-width="2" stroke-linecap="round"/>
<rect x="60" y="46" width="90" height="28" rx="4" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<rect x="220" y="46" width="110" height="28" rx="4" fill="#e6faf5" stroke="#00a87e" stroke-width="1.5"/>
<rect x="300" y="46" width="60" height="28" rx="4" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5" opacity="0.85"/>
<rect x="470" y="46" width="120" height="28" rx="4" fill="#f1eafe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="190" y="34" font-size="12" fill="#01664b" text-anchor="middle" font-weight="700">Gene A</text>
<text x="470" y="34" font-size="12" fill="#5b21b6" text-anchor="middle" font-weight="700">Gene B</text>
<rect x="70" y="98" width="60" height="9" rx="3" fill="#00a87e" stroke="#00a87e" stroke-width="0"/>
<text x="140" y="107" font-size="11" fill="#5b6472" text-anchor="start" font-weight="400">assigned to A</text>
<rect x="236" y="122" width="60" height="9" rx="3" fill="#00a87e" stroke="#00a87e" stroke-width="0"/>
<rect x="305" y="146" width="60" height="9" rx="3" fill="#e0762a" stroke="#e0762a" stroke-width="0"/>
<text x="375" y="155" font-size="11" fill="#5b6472" text-anchor="start" font-weight="400">ambiguous: overlaps A and B</text>
<rect x="385" y="170" width="60" height="9" rx="3" fill="#b6bfca" stroke="#b6bfca" stroke-width="0"/>
<text x="455" y="179" font-size="11" fill="#5b6472" text-anchor="start" font-weight="400">no feature: intron or intergenic</text>
<rect x="490" y="194" width="60" height="9" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="0"/>
<text x="560" y="203" font-size="11" fill="#5b6472" text-anchor="start" font-weight="400">assigned to B</text>
<rect x="86" y="218" width="60" height="9" rx="3" fill="#e5484d" stroke="#e5484d" stroke-width="0"/>
<rect x="500" y="218" width="60" height="9" rx="3" fill="#e5484d" stroke="#e5484d" stroke-width="0"/>
<line x1="146" y1="222.5" x2="500" y2="222.5" stroke="#e5484d" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="323" y="240" font-size="11" fill="#5b6472" text-anchor="middle" font-weight="400">multi-mapping: the same read fits two places, so it is not counted by default</text>
</svg>
