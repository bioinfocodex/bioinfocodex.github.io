# Netlify configuration for bioinfocodex.com
#
# The site is built from src/ into dist/ by one standard-library Python script.
# Every route is a real HTML file, so there are no rewrite rules: the redirects
# that remain (src/_redirects) only keep old addresses working.

[build]
  command   = "python3 tools/build-site.py"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# Pages change on every content edit, so they always revalidate.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Stylesheet, scripts and the search index carry a content hash in their file
# name, so a changed file is a new URL and the old one can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons and the share card are content-stable; let them cache hard.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Figures on the pages keep their names when replaced, so a day is the limit.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Crawlers refetch these two constantly; an hour collapses a burst of bots
# into one request each.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Lessons. The catalogue and each lesson.json change whenever a lesson is added
# or rebuilt under the same name, so they always revalidate. The media files
# keep their names across rebuilds too, so a day is as long as they can cache.
[[headers]]
  for = "/lesson-files/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lesson-files/*/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/lesson-files/*/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/lesson-files/*/*.vtt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
