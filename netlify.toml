# Netlify configuration for bioinfocodex.com
#
# The site is one static HTML file with no build step -- deploys are uploads.
# Netlify (rather than GitHub Pages) is what makes the app routes indexable:
# Pages cannot rewrite, so /tools/rnaflow had to be answered by 404.html with a
# 404 status. The rewrite rules live in _redirects.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# The app is one HTML file that changes on every content edit — never cache it.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and the share card are content-stable; let them cache hard.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The SVG favicon belongs with the PNGs above -- it was falling through to the
# default and being revalidated on every visit.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest changes only when the icon set or app name does.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Crawlers refetch these two constantly. An hour is short enough that a routing
# change still reaches search engines the same day, and long enough to collapse
# a burst of bots into one request each.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
