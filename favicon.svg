<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Simplified cut of the site logo. The four thin DNA rungs and the hairline
       hex border in the header mark turn to mush below ~24px, so this version
       keeps only what still reads at 16px: the hexagon, the two strands and the
       three nodes. Dark ground so it stays visible on a light tab bar. -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4a0"/>
      <stop offset="100%" stop-color="#0096ff"/>
    </linearGradient>
  </defs>
  <polygon points="20,1 37,10.5 37,29.5 20,39 3,29.5 3,10.5" fill="#0d1117"/>
  <polygon points="20,1 37,10.5 37,29.5 20,39 3,29.5 3,10.5" fill="none" stroke="url(#g)" stroke-width="2.6"/>
  <path d="M13 9 Q17.5 14.5 13 20 Q8.5 25.5 13 31" stroke="#00d4a0" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M27 9 Q22.5 14.5 27 20 Q31.5 25.5 27 31" stroke="#0096ff" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="11.5" r="3.1" fill="#00d4a0"/>
  <circle cx="20" cy="20"   r="3.1" fill="#7c5ff5"/>
  <circle cx="20" cy="28.5" r="3.1" fill="#0096ff"/>
</svg>
